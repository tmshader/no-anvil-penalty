name: Build and Publish Release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          cache: "gradle"
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.2
          cache-provider: basic
          add-job-summary: 'on-failure'

      - name: Create Changelog
        run: |
          git fetch --tags --force
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > changelog.md
          printf "### Changes:\n" > release-notes.md
          cat changelog.md >> release-notes.md

      - name: Build and Publish to Modrinth
        run: gradle modrinth -Pmod_version="${GITHUB_REF_NAME#v}"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: "build/libs/NoAnvilPenalty-*.jar"
          body_path: release-notes.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: "build/libs/NoAnvilPenalty-*.jar"